<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - MS Computer</title>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <!-- Main CSS -->
    <link rel="stylesheet" href="/css/ms.css">

    <!-- Login CSS -->
    <link rel="stylesheet" href="/css/login.css">
</head>

<body>

    <!-- ===== LOGIN PAGE ===== -->
    <section class="login-page">

        <div class="login-container">

            <!-- Logo -->
            <div class="login-logo">
                <img src="/photos/logo.png" alt="MS Computer">
                <h1 data-lang="welcomeBack">Welcome Back!</h1>
                <p data-lang="loginSubtitle">Sign in to your account to continue</p>
            </div>

            <!-- Login Form -->
            <form id="login-form">
                <div class="form-group">
                    <label for="login-email" data-lang="emailAddress">Email Address</label>
                    <div class="input-group">
                        <i class="fa-solid fa-envelope"></i>
                        <input type="email" id="login-email" placeholder="Enter your email" data-lang="emailPlaceholder" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="login-password" data-lang="password">Password</label>
                    <div class="input-group">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="login-password" placeholder="Enter your password" data-lang="passwordPlaceholder" required>
                        <button type="button" class="toggle-password" onclick="togglePassword()">
                            <i class="fa-solid fa-eye" id="password-icon"></i>
                        </button>
                    </div>
                </div>

                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" id="remember-me">
                        <span data-lang="rememberMe">Remember Me</span>
                    </label>
                    <a href="forgot-password.html" data-lang="forgotPassword">Forgot Password?</a>
                </div>

                <button type="submit" class="login-btn" data-lang="login">
                    <i class="fa-solid fa-arrow-right-to-bracket"></i> Login
                </button>

                <!-- ✅ الـ Link هنا -->
                <p class="register-link" data-lang="noAccount"></p> <div class="register"><a href="signup.html" data-lang="register" class="register">Register</a></div>
            </form>

            <!-- Error Message -->
            <div id="login-error" class="login-error" style="display:none;">
                <i class="fa-solid fa-circle-exclamation"></i>
                <span id="error-message" data-lang="invalidCredentials">Invalid email or password</span>
            </div>

        </div>

    </section>

    <!-- ===== TOAST ===== -->
    <div id="toast" style="position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:var(--card);color:var(--text);padding:14px 24px;border-radius:12px;box-shadow:var(--shadow);z-index:9999;display:none;border:1px solid var(--border);">
        <span id="toast-text">Product Added Successfully</span>
    </div>

    <!-- ===== SCRIPTS ===== -->
    <script src="/js/language.js"></script>
    <script src="/js/login.js"></script>
</body>

</html>
