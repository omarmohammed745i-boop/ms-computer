<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - MS Computer</title>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <!-- Main CSS -->
    <link rel="stylesheet" href="/css/ms.css">

    <!-- Login CSS -->
    <link rel="stylesheet" href="/css/login.css">
</head>

<body>

    <!-- ===== LOGIN PAGE ===== -->
    <section class="login-page">

        <div class="login-container">

            <!-- Logo -->
            <div class="login-logo">
                <img src="/photos/logo.png" alt="MS Computer">
                <h1 data-lang="welcomeBack">Welcome Back!</h1>
                <p data-lang="loginSubtitle">Sign in to your account to continue</p>
            </div>

            <!-- Login Form -->
            <form id="login-form">
                <div class="form-group">
                    <label for="login-email" data-lang="emailAddress">Email Address</label>
                    <div class="input-group">
                        <i class="fa-solid fa-envelope"></i>
                        <input type="email" id="login-email" placeholder="Enter your email" data-lang="emailPlaceholder" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="login-password" data-lang="password">Password</label>
                    <div class="input-group">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="login-password" placeholder="Enter your password" data-lang="passwordPlaceholder" required>
                        <button type="button" class="toggle-password" onclick="togglePassword()">
                            <i class="fa-solid fa-eye" id="password-icon"></i>
                        </button>
                    </div>
                </div>

                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" id="remember-me">
                        <span data-lang="rememberMe">Remember Me</span>
                    </label>
                    <a href="forgot-password.html" data-lang="forgotPassword">Forgot Password?</a>
                </div>

                <button type="submit" class="login-btn" data-lang="login">
                    <i class="fa-solid fa-arrow-right-to-bracket"></i> Login
                </button>
                <!-- ✅ Google Login Button -->
<div style="text-align: center; margin: 20px 0;">
    <div style="display: flex; align-items: center; gap: 15px; margin-bottom: 15px;">
        <div style="flex: 1; height: 1px; background: var(--border);"></div>
        <span style="color: var(--text3); font-size: 13px;">OR</span>
        <div style="flex: 1; height: 1px; background: var(--border);"></div>
    </div>

    <a href="https://ms-computer-production.up.railway.app/api/auth/google" 
       style="
           display: flex;
           align-items: center;
           justify-content: center;
           gap: 12px;
           width: 100%;
           padding: 14px;
           background: #fff;
           color: #333;
           border-radius: 14px;
           text-decoration: none;
           font-size: 15px;
           font-weight: 600;
           transition: all 0.3s ease;
           border: 1px solid var(--border);
       "
       onmouseover="this.style.background='#f5f5f5'; this.style.transform='translateY(-2px)';"
       onmouseout="this.style.background='#fff'; this.style.transform='translateY(0)';">
        <svg width="20" height="20" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
        </svg>
        <span>Continue with Google</span>
    </a>
</div>
                <!-- ✅ الـ Link هنا -->
                <p class="register-link" data-lang="noAccount"></p> <div class="register"><a href="signup.html" data-lang="register" class="register">Register</a></div>
            </form>

            <!-- Error Message -->
            <div id="login-error" class="login-error" style="display:none;">
                <i class="fa-solid fa-circle-exclamation"></i>
                <span id="error-message" data-lang="invalidCredentials">Invalid email or password</span>
            </div>

        </div>

    </section>

    <!-- ===== TOAST ===== -->
    <div id="toast" style="position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:var(--card);color:var(--text);padding:14px 24px;border-radius:12px;box-shadow:var(--shadow);z-index:9999;display:none;border:1px solid var(--border);">
        <span id="toast-text">Product Added Successfully</span>
    </div>

    <!-- ===== SCRIPTS ===== -->
    <script src="/js/language.js"></script>
    <script src="/js/login.js"></script>
</body>

</html>
