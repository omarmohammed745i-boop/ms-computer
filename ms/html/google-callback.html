<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logging in...</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #0f1115;
            color: white;
            font-family: Arial, sans-serif;
            margin: 0;
        }
        .loader {
            text-align: center;
        }
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.1);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border-left-color: #00d4b4;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="loader">
        <div class="spinner"></div>
        <h2>جاري تسجيل الدخول...</h2>
        <p>Please wait, redirecting...</p>
    </div>

    <script>
        // الحصول على البيانات من الرابط (URL)
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        const userString = urlParams.get('user');

        if (token && userString) {
            try {
                // حفظ التوكن وبيانات المستخدم
                localStorage.setItem('token', token);
                
                // فك تشفير بيانات المستخدم (لأنها جاية مشفرة من الباك إند)
                const user = JSON.parse(decodeURIComponent(userString));
                localStorage.setItem('loggedInUser', JSON.stringify(user));
                localStorage.setItem('userId', user.id);

                // التحويل للصفحة الرئيسية
                window.location.href = 'ms.html';
            } catch (error) {
                console.error('Error parsing user data:', error);
                alert('حدث خطأ أثناء قراءة البيانات. حاول مرة أخرى.');
                window.location.href = 'login.html';
            }
        } else {
            // لو مفيش بيانات، يروح لصفحة تسجيل الدخول
            alert('Missing token or user data');
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
